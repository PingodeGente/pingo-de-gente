  <style>

    * {

body {

    flex-direction: column;
    align-items: flex-start;
  }

  .acoes {
    width: 100%;
  }

  .acoes button {
    flex: 1;
  }
}

<body>
 <div id="telaSenha">
  <h2 style="color:#1a3a5c;">Área da Loja</h2>
<p style="color:#555;">Confirme seu acesso à área da loja.</p>

 <input id="senhaAdmin" type="password" placeholder="Senha da sua conta"
         style="width:100%;padding:12px;margin:14px 0;border:2px solid #e0e0e0;border-radius:10px;box-sizing:border-box;">

<button type="submit" onclick="entrarAdmin()" style="width:100%;">Entrar</button>

<button type="button" class="secondary" onclick="cancelarAcessoAdmin()"
        style="width:100%;margin-top:10px;">
  Cancelar
</button>

  <p id="erroSenha" style="color:#ef5350;display:none;margin-top:10px;">
    Senha incorreta.
  </p>
</div>

<div class="container" id="areaAdmin" style="display:none;"> 
  <div class="container">
    <h1>Gerenciamento da Loja</h1>

    <div class="card">
      <h2>Cadastrar produto</h2>

      <label for="nome">Nome do produto</label>
      <input id="nome" type="text" placeholder="Ex.: Vestido Floral">

     <label for="codigo">Código do produto</label>
<input id="codigo" type="text" readonly placeholder="Gerado automaticamente">

<label for="categoria">Categoria</label>
<select id="categoria">
  <option value="masc">Masculino</option>
  <option value="fem">Feminino</option>
  <option value="uni">Unissex</option>
</select>

<label for="precoReal">Preço real (R$)</label>
<input id="precoReal" type="number" step="0.01" min="0" placeholder="119.90">

<label for="precoPromocional">Preço promocional (R$)</label>
<input id="precoPromocional" type="number" step="0.01" min="0" placeholder="79.90">

<label for="estoque">Estoque</label>
<input id="estoque" type="number" min="0" value="1">

<label for="fotoGaleria">Foto do produto</label>
<input id="fotoGaleria" type="file" accept="image/*" onchange="selecionarFoto(event)">

<button type="button" class="secondary" onclick="abrirCamera()">
  Tirar foto com a câmera
</button>
<div id="previewFoto" style="margin: 14px 0;">
  <img id="imagemPreview" src="" alt="Prévia da foto"
       style="display:none; max-width: 100%; max-height: 260px; border-radius: 12px;">

  <button type="button" class="secondary" id="botaoRemoverFoto"
          onclick="removerFoto()"
          style="display:none;">
    Remover foto
  </button>
</div>
<button id="botaoCadastrar" onclick="salvarProduto()">Cadastrar</button>
     
      <button class="secondary" onclick="window.location.href='index.html'">
        Voltar ao catálogo
      </button>
    </div>

    <div class="card">
      <h2>Produtos cadastrados</h2>
      <div id="listaProdutos">
        Carregando...
      </div>
    </div>
  </div>

  <script>
  let produtos = [];
const API_URL = 'https://pingo-de-gente.onrender.com';
let fotoProduto = null;
let contadorCodigo = 1;

function gerarCodigo(categoria) {
  const prefixo = {
    masc: 'PDG-M',
    fem: 'PDG-F',
    uni: 'PDG-U'
  }[categoria];

  const numero = String(contadorCodigo).padStart(4, '0');

  return `${prefixo}${numero}`;
}

async function selecionarFoto(evento) {
  const arquivos = Array.from(evento.target.files);

  if (arquivos.length === 0) {
    return;
  }

  for (const arquivo of arquivos) {
    if (!arquivo.type.startsWith('image/')) {
      alert('Selecione apenas arquivos de imagem.');
      continue;
    }

    const foto = await comprimirImagem(arquivo);
    fotosProduto.push(foto);
  }

  renderizarFotos();

  evento.target.value = '';
}

async function comprimirImagem(arquivo) {
  return new Promise((resolver) => {
    const leitor = new FileReader();

    leitor.onload = function (eventoLeitura) {
      const imagem = new Image();

      imagem.onload = function () {
        const larguraMaxima = 800;
        const alturaMaxima = 800;

        let largura = imagem.width;
        let altura = imagem.height;

        if (largura > larguraMaxima || altura > alturaMaxima) {
          const proporcao = Math.min(
            larguraMaxima / largura,
            alturaMaxima / altura
          );

          largura = Math.round(largura * proporcao);
          altura = Math.round(altura * proporcao);
        }

        const canvas = document.createElement('canvas');
        canvas.width = largura;
        canvas.height = altura;

        const contexto = canvas.getContext('2d');
        contexto.drawImage(imagem, 0, 0, largura, altura);

        resolver(canvas.toDataURL('image/jpeg', 0.7));
      };

      imagem.src = eventoLeitura.target.result;
    };

    leitor.readAsDataURL(arquivo);
  });
}
function renderizarFotos() {
  const container = document.getElementById('previewFoto');
  container.innerHTML = '';

  fotosProduto.forEach((foto, index) => {
    const div = document.createElement('div');
    div.style.cssText = 'display:inline-block;margin:6px;position:relative;';

    const img = document.createElement('img');
    img.src = foto;
    img.style.cssText = 'width:110px;height:110px;object-fit:cover;border-radius:10px;';

    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.style.cssText = 'position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;';
    btn.onclick = () => {
      fotosProduto.splice(index, 1);
      renderizarFotos();
    };

    div.appendChild(img);
    div.appendChild(btn);
    container.appendChild(div);
  });
}
function removerFoto() {
  fotoProduto = null;

  const preview = document.getElementById('imagemPreview');
  preview.src = '';
  preview.style.display = 'none';

  document.getElementById('botaoRemoverFoto').style.display = 'none';
  document.getElementById('fotoGaleria').value = '';
}

function abrirCamera() {
  const campoCamera = document.createElement('input');
  campoCamera.type = 'file';
  campoCamera.accept = 'image/*';
  campoCamera.capture = 'environment';

  campoCamera.onchange = function (evento) {
    selecionarFoto(evento);
  };

  campoCamera.click();
}

function atualizarCodigo() {
  const categoria = document.getElementById('categoria').value;
  document.getElementById('codigo').value = gerarCodigo(categoria);
}

async function salvarProduto() {
  const nome = document.getElementById('nome').value.trim();
  const categoria = document.getElementById('categoria').value;
  const codigo = document.getElementById('codigo').value.trim();
  const precoReal = Number(document.getElementById('precoReal').value);
  const precoPromocional = Number(document.getElementById('precoPromocional').value);
  const estoque = Number(document.getElementById('estoque').value);

  if (!nome || !codigo || precoReal <= 0 || precoPromocional <= 0 || estoque < 0) {
    alert('Preencha nome, código, preços e estoque corretamente.');
    return;
  }

  if (precoPromocional > precoReal) {
    alert('O preço promocional não pode ser maior que o preço real.');
    return;
  }
const dados = {
  nome,
  categoria,
  codigo,
  precoReal,
  precoPromocional,
  estoque,
  fotoUrl: fotosProduto[0] || null,
  fotos: fotosProduto
};

const token = localStorage.getItem('token');

const botao = document.getElementById('botaoCadastrar');
const textoOriginal = botao.textContent;

  try {
    botao.disabled = true;
    botao.textContent = produtoEmEdicao
      ? 'Salvando alterações...'
      : 'Cadastrando...';

    const url = produtoEmEdicao
      ? `${API_URL}/api/produtos/${produtoEmEdicao}`
      : `${API_URL}/api/produtos`;

    const resposta = await fetch(url, {
  method: produtoEmEdicao ? 'PUT' : 'POST',
  headers: {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`
  },
  body: JSON.stringify(dados)
});
    const resultado = await resposta.json();

    if (!resposta.ok) {
      alert(resultado.erro || 'Não foi possível salvar o produto.');
      return;
    }

        alert(produtoEmEdicao
      ? 'Produto atualizado com sucesso.'
      : 'Produto cadastrado com sucesso.');

    cancelarEdicao();
    await carregarProdutos();

  } catch (erro) {
    console.error('Erro ao salvar produto:', erro);
    alert('Não foi possível concluir a operação. Consulte o Console.');
  } finally {
    botao.disabled = false;
    botao.textContent = produtoEmEdicao
      ? 'Salvar alterações'
      : 'Cadastrar';
  }
}

function obterFotoBase64() {
  const preview = document.getElementById('imagemPreview');

  if (preview && preview.src && preview.src.startsWith('data:image')) {
    return preview.src;
  }

  return null;
}

async function removerProduto(id) {
  if (!confirm('Deseja realmente excluir este produto?')) {
    return;
  }

  const token = localStorage.getItem('token') || sessionStorage.getItem('authToken');

  if (!token) {
    alert('Sessão expirada. Faça login novamente.');
    return;
  }

  try {
    const resposta = await fetch(`${API_URL}/api/produtos/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      }
    });

    const dados = await resposta.json().catch(() => ({}));

    if (!resposta.ok) {
      alert(dados.erro || dados.message || 'Erro ao excluir produto.');
      return;
    }

    produtos = produtos.filter(produto => produto.id !== id);
    renderizarProdutos();

    alert('Produto excluído com sucesso!');
  } catch (error) {
    console.error('Erro ao excluir produto:', error);
    alert('Não foi possível excluir o produto.');
  }
}

function renderizarProdutos() {
  const lista = document.getElementById('listaProdutos');

  if (produtos.length === 0) {
    lista.innerHTML = '<p>Nenhum produto cadastrado ainda.</p>';
    return;
  }

  lista.innerHTML = produtos.map(produto => `
    <div class="produto">
      <div style="display:flex; gap:12px; align-items:center;">
        <img src="${produto.foto_url || ''}"
             alt="Foto de ${produto.nome}"
             style="width:64px; height:64px; object-fit:cover; border-radius:10px;
                    display:${produto.foto_url ? 'block' : 'none'};">

        <div>
          <strong>${produto.nome}</strong><br>

          <small>
            ${produto.codigo} —
            <s>R$ ${Number(produto.preco_real).toFixed(2)}</s>
            <strong style="color:#00a651;">
              R$ ${Number(produto.preco_promocional).toFixed(2)}
            </strong>
            — Estoque: ${produto.estoque}
          </small>

          <div style="font-size:12px; color:#555; margin-top:4px;">
            Categoria:
            ${produto.categoria === 'masc' ? 'Masculino' : produto.categoria === 'fem' ? 'Feminino' : 'Unissex'}
          </div>
        </div>
      </div>

      <div class="acoes">
        <button class="secondary" onclick="editarProduto('${produto.id}')">
    Editar
  </button>

        <button type="button" class="excluir" onclick="removerProduto('${produto.id}')">
            Excluir
        </button>
      </div>
    </div>
  `).join('');
}
let produtoEmEdicao = null;
let fotosProduto = [];

function editarProduto(id) {
  const produto = produtos.find(item => item.id === id);

  if (!produto) {
    alert('Produto não encontrado.');
    return;
  }

  produtoEmEdicao = id;

  document.getElementById('nome').value = produto.nome;
  document.getElementById('codigo').value = produto.codigo;
  document.getElementById('categoria').value = produto.categoria;
  document.getElementById('precoReal').value = Number(produto.preco_real);
  document.getElementById('precoPromocional').value = Number(produto.preco_promocional);
  document.getElementById('estoque').value = produto.estoque;

  fotoProduto = produto.foto_url || null;

  const preview = document.getElementById('imagemPreview');

  if (fotoProduto) {
  preview.src = fotoProduto;
  preview.style.display = 'block';
  document.getElementById('botaoRemoverFoto').style.display = 'inline';
} else {
  preview.src = '';
  preview.style.display = 'none';
  document.getElementById('botaoRemoverFoto').style.display = 'none';
}

  document.getElementById('botaoCadastrar').textContent = 'Salvar alterações';
}

function cancelarEdicao() {
  produtoEmEdicao = null;
  fotoProduto = null;
  fotosProduto = [];

  document.getElementById('nome').value = '';
  document.getElementById('precoReal').value = '';
  document.getElementById('precoPromocional').value = '';
  document.getElementById('estoque').value = 1;
  document.getElementById('fotoGaleria').value = '';

  renderizarFotos();
  atualizarCodigo();

  document.getElementById('botaoCadastrar').textContent = 'Cadastrar';
}

async function carregarProdutos() {
  try {
    const resposta = await fetch(`${API_URL}/api/produtos`);
    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || 'Erro ao carregar produtos.');
    }

    produtos = dados;
    renderizarProdutos();
  } catch (error) {
    console.error(error);
    document.getElementById('listaProdutos').innerHTML =
      '<p>Não foi possível carregar os produtos.</p>';
  }
}

document.getElementById('categoria').addEventListener('change', atualizarCodigo);

atualizarCodigo();
carregarProdutos();
  </script>
<script>

 async function entrarAdmin() {
  const senha = document.getElementById('senhaAdmin').value;
  const erro = document.getElementById('erroSenha');

  erro.style.display = 'none';

  const token = localStorage.getItem('token');

  if (!token) {
    erro.textContent = 'Faça login antes de acessar a área da loja.';
    erro.style.display = 'block';
    return;
  }

  if (!senha) {
    erro.textContent = 'Digite sua senha.';
    erro.style.display = 'block';
    return;
  }

  let email;

  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    email = payload.email;
  } catch (e) {
    erro.textContent = 'Sessão inválida. Faça login novamente.';
    erro.style.display = 'block';
    return;
  }

  if (!email) {
    erro.textContent = 'Não foi possível identificar sua conta. Faça login novamente.';
    erro.style.display = 'block';
    return;
  }

  try {
    const resposta = await fetch('https://pingo-de-gente.onrender.com/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      erro.textContent = dados.message || 'Senha incorreta.';
      erro.style.display = 'block';
      return;
    }

    if (!['admin', 'lojista'].includes(dados.user.role)) {
      erro.textContent = 'Acesso restrito a administradores e lojistas.';
      erro.style.display = 'block';
      return;
    }

    localStorage.setItem('token', dados.token);

    document.getElementById('telaSenha').style.display = 'none';
    document.getElementById('areaAdmin').style.display = 'block';
  } catch (e) {
    erro.textContent = 'Não foi possível conectar ao servidor.';
    erro.style.display = 'block';
  }
}function cancelarAcessoAdmin() {
  document.getElementById('senhaAdmin').value = '';
  document.getElementById('erroSenha').style.display = 'none';
  window.location.href = 'index.html';
}
</script>
